<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>NOLTA - Demo account</title><link rel="stylesheet" href="styles.css"/><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/></head><body><main class="phone-shell auth-shell"><div class="auth-logo"><span class="brand-mark">N</span><span>NOLTA</span></div><p class="eyebrow">PROTOTYPE ACCOUNT</p><h1>Create user</h1><p class="auth-note">This creates a local demo user. Admin accounts cannot be created here.</p><label>Full name<input id="name" placeholder="Jordan Lee"/></label><label>Email<input id="email" type="email" placeholder="jordan@example.com"/></label><button class="confirm-button" id="createButton">Create account <span>→</span></button><a class="auth-link" href="login.html">Back to login</a><p id="error" class="auth-error"></p></main><script src="assets/js/auth.js"></script><script>document.querySelector('#createButton').onclick=()=>{const name=document.querySelector('#name').value.trim(),email=document.querySelector('#email').value.trim(),error=document.querySelector('#error');if(!name||!email){error.textContent='Enter your name and email.';return;}const user=window.NoltaAuth.createUser(name,email);if(!user){error.textContent='That email already has a demo account.';return;}location.href='user-home.html';};</script></body></html>
