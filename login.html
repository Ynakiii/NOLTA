<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>NOLTA - Demo login</title><link rel="stylesheet" href="styles.css"/><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/></head><body><main class="phone-shell auth-shell"><div class="auth-logo"><span class="brand-mark">N</span><span>NOLTA</span></div><p class="eyebrow">PROTOTYPE ACCESS</p><h1>Welcome back</h1><p class="auth-note">Choose a demo account to preview each interface.</p><label>Demo account<select id="accountSelect"></select></label><button class="confirm-button" id="loginButton">Continue <span>→</span></button><a class="auth-link" href="register.html">Create a demo user account</a><small class="prototype-warning">Prototype only. No passwords or secure sessions are used.</small></main><script src="assets/js/auth.js"></script><script>const select=document.querySelector('#accountSelect');select.innerHTML=window.NoltaAuth.users().map(user=>`<option value="${user.id}">${user.name} - ${user.role}</option>`).join('');document.querySelector('#loginButton').onclick=()=>{window.NoltaAuth.setActive(select.value);const user=window.NoltaAuth.active();location.href=user.role==='admin'?'index.html':'user-home.html';};</script></body></html>
