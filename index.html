<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#f5f4ef"/><title>NOLTA - Schedule</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="styles.css"/></head><body><main class="phone-shell"><header class="topbar"><a class="brand" href="index.html"><svg class="nolta-logo" viewBox="0 0 96 76" role="img" aria-label="NOLTA logo"><rect width="96" height="76" rx="4" fill="#fff"/><path d="M5 5H91L54 52H5Z" fill="#172b70"/><path d="M91 5L54 52H91Z" fill="#238b57"/><path d="M5 5L54 52" stroke="#fff" stroke-width="4"/><circle cx="70" cy="22" r="4" fill="#d5df27"/><text x="9" y="69" fill="#172b70" font-family="Arial" font-size="13" font-weight="800">NOLTA</text></svg><span>NOLTA</span></a><span class="admin-badge">ADMIN</span></header><nav class="page-nav"><a data-page-link href="index.html">Schedule</a><a data-page-link href="courts.html">Courts</a><a data-page-link href="activity.html">Activity</a></nav><section class="intro"><div><p class="eyebrow">COURT MANAGEMENT</p><h1>Schedule</h1></div><button class="today-button" id="todayButton">Today</button></section><section class="court-status-card"><div><p class="eyebrow">SELECTED COURT</p><strong id="selectedCourtLabel"></strong></div><span class="storage-note" id="statusText"></span></section><section class="calendar-card"><div class="calendar-header"><button id="previousPeriod">‹</button><strong id="periodLabel"></strong><button id="nextPeriod">›</button></div><div class="view-switcher"><button class="view-button active" data-view="month">Month</button><button class="view-button" data-view="week">Week</button><button class="view-button" data-view="day">Day</button></div><div class="weekdays"><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span></div><div class="calendar-grid" id="calendarGrid"></div></section><section class="booking-head"><div><p class="eyebrow" id="selectedDateLabel"></p><h2>Available times</h2></div><select id="courtSelect" class="inline-select" aria-label="Select court"></select></section><section class="time-section"><div class="section-label"><span>TIME SLOTS</span><small id="durationLabel"></small></div><div class="time-grid" id="timeGrid"></div></section><section class="admin-panel"><div class="section-label"><span>OPERATING HOURS</span><small>Selected court</small></div><div class="inline-fields"><label>Opens<input id="openingTime" type="time"/></label><label>Closes<input id="closingTime" type="time"/></label></div><div class="inline-fields duration-settings"><label>Minimum (min)<input id="minDuration" type="number" min="1" max="720"/></label><label>Default (min)<input id="defaultDuration" type="number" min="1" max="720"/></label><label>Start interval (min)<input id="startInterval" type="number" min="1" max="720"/></label></div><button class="secondary-button" id="saveSettings">Save schedule settings</button></section><section class="admin-panel"><div class="section-label"><span>SCHEDULE RULES</span><small>Blocked / maintenance periods</small></div><div class="inline-fields"><label>Date<input id="ruleDate" type="date"/></label><label>From<input id="ruleStart" type="time" value="06:00"/></label><label>To<input id="ruleEnd" type="time" value="15:00"/></label></div><div class="inline-fields second-row"><label>Status<select id="ruleStatus"><option value="unavailable">Unavailable</option><option value="maintenance">Maintenance</option><option value="available">Available</option></select></label><label class="wide-field">Note<input id="ruleNote" placeholder="Optional note"/></label></div><button class="secondary-button" id="saveRule">Add schedule rule</button><div class="rule-list" id="ruleList"></div></section><section class="reservation-form"><div class="section-label"><span>NEW RESERVATION</span><small>Selected date and time</small></div><label>Player name<input id="playerName" placeholder="e.g. Jordan Lee"/></label><label>Duration (min)<input id="reservationDuration" type="number" min="1"/></label><button class="confirm-button" id="confirmButton" disabled>Create reservation <span>→</span></button></section><nav class="bottom-nav"><a class="nav-item" data-page-link href="index.html"><span>▦</span><small>Schedule</small></a><a class="nav-item" data-page-link href="courts.html"><span>⌂</span><small>Courts</small></a><a class="nav-item" data-page-link href="activity.html"><span>⌁</span><small>Activity</small></a></nav></main><div class="toast" id="toast"></div><script src="assets/js/storage.js"></script><script src="assets/js/navigation.js"></script><script src="assets/js/schedule-page.js"></script></body></html>
